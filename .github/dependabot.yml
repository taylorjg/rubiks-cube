version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: auto
    groups:
      dev-patch-minor:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "@types/node"
    ignore:
      # @types/node majors track Node majors — pin to .nvmrc; bump manually on Node upgrade
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: auto
